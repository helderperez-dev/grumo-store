name: CI

on:
  push:
    branches: [main]
  pull_request:


# A new commit supersedes queued/running CI for the same pull request.
# Keep unrelated branches and the default-branch pipeline independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh-pyo3-lock:
    name: Refresh PyO3 dependency lock on Grumo compatibility PR
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/grumo-rebrand-foundation' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/grumo-rebrand-foundation
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve patched PyO3 and validate Rust workspace
        run: |
          cargo update -p pyo3 --precise 0.29.0
          cargo check --workspace --all-targets
      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(lockfile): use patched PyO3 0.29"
          git push origin HEAD:chore/grumo-rebrand-foundation

  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate observability contract
        run: python scripts/check_observability_contract.py
      - name: Validate observability dashboard
        run: python scripts/check_observability_dashboard.py
      - name: Upload validated Grafana dashboard
        uses: actions/upload-artifact@v4
        with:
          name: voodoo-store-grafana-dashboard
          path: docs/OBSERVABILITY_GRAFANA_DASHBOARD.json
          if-no-files-found: error
      - name: Format
        run: cargo fmt --all -- --check
      - name: C ABI consumer smoke
        run: python scripts/c_abi_smoke.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust workspace
        run: cargo test --workspace --exclude voodoo-store-python

  python:
    name: python ${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Fixed Ubuntu runner for Python 3.9: ubuntu-latest now resolves
        # to 26.04, which no longer supplies a hosted Python 3.9 binary.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install Python package
        run: python -m pip install . pytest
      - name: Verify built wheel includes Grumo compatibility namespace
        shell: bash
        run: |
          python -m pip install "maturin>=1.9,<2"
          python -m maturin build --out dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as wheel:
              members = set(wheel.namelist())
          required = {
              "grumo_store/__init__.py",
              "grumo_store/grumo_migration.py",
              "grumo_store/backup.py",
              "grumo_store/migrations.py",
              "grumo_store/objects.py",
              "voodoo_store/__init__.py",
              "voodoo_store/grumo_migration.py",
          }
          missing = required - members
          if missing:
              raise SystemExit(f"Wheel is missing compatibility modules: {sorted(missing)}")
          print("Both Python namespaces are present in the wheel")
          PY
      - name: Audit Python runtime dependencies
        shell: bash
        run: |
          # The project's runtime dependency graph is audited, not the
          # ephemeral runner's build tools (which may contain vulnerable
          # setuptools versions unrelated to the published wheel).
          if python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'; then
            python -m pip install "pip-audit==2.10.1"
          else
            python -m pip install "pip-audit==2.9.0"
          fi
          python -m pip_audit . --progress-spinner off
      - name: Verify both installed Python namespaces
        run: |
          python -c "import grumo_store, voodoo_store; assert grumo_store.Store is voodoo_store.Store"
          python -m grumo_store.grumo_migration --help
      - name: Test Python package
        run: python -m pytest python/tests -q

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets
