[workspace]
members = [
    "crates/grumo-store-core",
    "crates/grumo-store-ffi",
    "crates/grumo-store-cli",
    "crates/grumo-store-python",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/helderperez-dev/grumo-store"
rust-version = "1.85"

[workspace.dependencies]
crc32fast = "1.4"
fs2 = "0.4"
getrandom = "0.4"
sha2 = "0.10"
thiserror = "2"
