[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "grumo-store"
version = "0.3.2"
description = "Embedded application state engine for Python, backed by Grumo Store Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Helder Perez" }]
keywords = ["embedded", "database", "state", "runtime", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/helderperez-dev/grumo-store"
Repository = "https://github.com/helderperez-dev/grumo-store"
Issues = "https://github.com/helderperez-dev/grumo-store/issues"

[tool.maturin]
manifest-path = "crates/voodoo-store-python/Cargo.toml"
python-source = "python"
module-name = "grumo_store._native"
bindings = "pyo3"
# Package the transitional Grumo namespace alongside the legacy native
# extension. Without this explicit list, mixed-project builds may include
# only the package containing the extension module.
python-packages = ["voodoo_store", "grumo_store"]
include = [{ path = "LICENSE", format = "sdist" }]
